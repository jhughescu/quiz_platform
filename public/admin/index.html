<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Admin</title>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <main class="container admin-container">
      <h1>Quiz Admin</h1>

      <div id="login-container"></div>

      <section id="dashboard-view" hidden>
        <div class="dashboard-header">
          <span id="current-user"></span>
          <button id="logout-btn" type="button">Log out</button>
        </div>

        <nav class="tabs">
          <button type="button" class="tab-btn active" data-tab="questions">
            Questions
          </button>
          <button type="button" class="tab-btn" data-tab="submissions">
            Submissions
          </button>
          <button type="button" class="tab-btn" data-tab="deployments">
            Deployments
          </button>
          <button
            type="button"
            class="tab-btn"
            data-tab="users"
            id="users-tab-btn"
            hidden
          >
            Users
          </button>
        </nav>

        <div id="questions-section-container"></div>
        <div id="deployments-section-container"></div>
        <div id="submissions-container"></div>
        <div id="users-container"></div>
        
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/handlebars@4.7.8/dist/handlebars.min.js"></script>
    <script type="module" src="admin-bootstrap.js"></script>
  </body>
</html>
